<title>Pot 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/*
  Pot 21 design system
  Layout: a slim top bar (brand, balance, wallet actions), then one focused screen:
  sign-in, lobby (play now + players waiting, how-to-play alongside), or the table
  (felt oval as the hero, action dock beneath). Wallet, rules and fairness live in
  a slide-over sheet so the game itself stays uncluttered. Dark by design.
*/
:root{
  --bg:#0B1322;          /* page */
  --surface:#111C2F;     /* panels */
  --raised:#18263D;      /* inputs, rows */
  --line:#24354F;
  --text:#EEF2F8;
  --muted:#93A2B9;
  --faint:#5E6E87;
  --felt:#123553;
  --felt-hi:#1B4A70;
  --rail:#0A1A2B;
  --gold:#F2B544;        /* money and the one primary action */
  --gold-ink:#2A1C02;
  --win:#3DD68C;
  --loss:#FF6B5E;
  --card:#FBF8F1;
  --card-red:#C6362C;
  --card-ink:#18202D;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.addr{font-family:var(--mono);font-size:.8rem;word-break:break-all}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#3A5070;background:#1E2F4A}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover:not(:disabled){background:#F6C463;border-color:#F6C463}
.btn.ghost{background:transparent}
.btn.lg{padding:15px 28px;font-size:1.05rem}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--text)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,19,34,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto;cursor:default}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-size:.95rem;font-weight:800;letter-spacing:-.04em}
.balance{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.balance .amt{font-family:var(--display);font-weight:700;font-size:1.05rem}
.balance .sym{color:var(--muted);font-size:.85rem}
.acct{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--text)}
.acct:hover{border-color:var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}
.demo-tag{font-size:.75rem;color:var(--gold);border:1px solid rgba(242,181,68,.4);border-radius:999px;padding:2px 9px}
@media (max-width:640px){
  .topbar-in{padding:10px 14px;gap:10px}
  .brand span.word,.acct .name,.demo-tag{display:none}
  .balance{padding-left:10px}
  .balance .btn{padding:6px 10px}
}

/* ---------- page frame ---------- */
.page{max-width:1180px;margin:0 auto;padding:20px 20px 32px}
@media (max-width:640px){.page{padding:18px 14px 48px}}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
@media (max-width:640px){.panel{padding:18px;border-radius:var(--r-md)}}

/* ---------- sign-in ---------- */
.signin{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;min-height:calc(100vh - 140px);padding-block:20px}
.signin h1{font-size:clamp(2.4rem,5.5vw,4.2rem);line-height:1;font-weight:800}
.signin .lede{font-size:1.1rem;color:var(--muted);max-width:44ch;margin:20px 0 28px}
.signin .cta{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:380px}
.signin .note{font-size:.85rem;color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:44px;max-width:620px}
.facts div{border-top:1px solid var(--line);padding-top:12px;font-size:.88rem;color:var(--muted)}
.facts b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}
.err{color:var(--loss);font-size:.9rem;min-height:1.3em;margin:0}
.devlogin{margin-top:22px;font-size:.88rem;color:var(--muted)}
.devlogin summary{cursor:pointer}
.devlogin form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.devlogin input{flex:1;min-width:160px}
.hero-table{position:relative;aspect-ratio:1/1;max-width:440px;width:100%;justify-self:center}
.hero-table .felt{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt-hi),var(--felt) 70%);box-shadow:0 0 0 10px var(--rail),0 0 0 11px var(--line),0 40px 80px rgba(0,0,0,.45)}
.hero-table .fan{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);display:flex}
.hero-table .fan .card{width:110px;height:156px;font-size:1.6rem}
.hero-table .fan .card:nth-child(1){transform:rotate(-9deg) translateX(16px)}
.hero-table .fan .card:nth-child(2){transform:rotate(7deg) translateX(-16px) translateY(6px)}
.hero-table .badge21{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:800;font-size:1.25rem;border-radius:999px;padding:6px 18px}
@media (max-width:860px){
  .signin{grid-template-columns:minmax(0,1fr);gap:28px;min-height:0}
  .hero-table{max-width:280px;order:-1}
  .hero-table .fan .card{width:80px;height:114px;font-size:1.2rem}
  .facts{grid-template-columns:minmax(0,1fr)}
}

/* ---------- inputs ---------- */
.input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;color:var(--text)}
.input:focus{outline:none;border-color:var(--gold)}
.field-label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}

/* ---------- lobby ---------- */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:960px){.lobby{grid-template-columns:minmax(0,1fr)}}
.lobby-main{display:flex;flex-direction:column;gap:24px;min-width:0}
.playnow h2{font-size:1.9rem;font-weight:800}
.playnow .sub{color:var(--muted);margin:6px 0 22px;max-width:56ch}
.stake-label{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.chip{position:relative;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--text);background:radial-gradient(circle,var(--raised) 54%,transparent 55%),repeating-conic-gradient(var(--chip,#3A5070) 0 15deg,#0E1A2C 15deg 30deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.chip:hover{filter:brightness(1.15)}
.chip[aria-pressed=true]{--chip:var(--gold);color:var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.play-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.play-hint{color:var(--muted);font-size:.92rem;margin:14px 0 0;max-width:62ch}
.more{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.more summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.more-body{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin-top:14px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:.8rem;font-weight:700;padding:0 7px;margin-left:8px;vertical-align:3px}
.waiting{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.waiting li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--raised);border:1px solid transparent}
.waiting li:hover{border-color:var(--line)}
.waiting .stack{display:flex}
.waiting .stack .avatar{width:34px;height:34px;margin-left:-10px;box-shadow:0 0 0 3px var(--raised)}
.waiting .stack .avatar:first-child{margin-left:0}
.waiting .stack .open{background:none;border:2px dashed var(--faint);box-shadow:0 0 0 3px var(--raised)}
.waiting .who{min-width:0}
.waiting .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.waiting .who span{font-size:.85rem;color:var(--muted)}
.waiting .money{text-align:right}
.waiting .money b{display:block;font-family:var(--display);font-size:1.15rem}
.waiting .money span{font-size:.8rem;color:var(--muted)}
.empty-state{padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted)}
.inplay{margin:12px 0 0;font-size:.85rem;color:var(--faint)}
@media (max-width:560px){.waiting li{grid-template-columns:minmax(0,1fr) auto;gap:10px}.waiting .stack{display:none}.waiting .money{text-align:left}}
.howto ol{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:step}
.howto li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;counter-increment:step}
.howto li::before{content:counter(step);width:32px;height:32px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.howto li b{display:block;margin-bottom:2px}
.howto li span{color:var(--muted);font-size:.92rem}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.values div{background:var(--raised);border-radius:var(--r-sm);padding:10px;text-align:center;font-size:.8rem;color:var(--muted)}
.values b{display:block;font-family:var(--display);font-size:1.1rem;color:var(--text)}
.howto .linkbtn{margin-top:16px;display:inline-block}

/* ---------- table ---------- */
.table-wrap{display:flex;flex-direction:column;gap:16px}
.table-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-6px}
.table-bar .title{margin-right:auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.table-bar .title h2{font-size:1.25rem}
.table-bar .title span{color:var(--muted);font-size:.9rem}
.felt{position:relative;border-radius:180px/110px;background:radial-gradient(ellipse at 50% 42%,var(--felt-hi),var(--felt) 72%);box-shadow:0 0 0 10px var(--rail),0 0 0 11px var(--line),0 30px 70px rgba(0,0,0,.45);padding:18px 28px 14px;margin:11px 11px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width:640px){.felt{border-radius:60px;padding:22px 10px;margin:8px 8px 0;box-shadow:0 0 0 7px var(--rail),0 0 0 8px var(--line);gap:16px;min-height:0}}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;width:100%}
.pot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 22px;border-radius:999px;background:rgba(5,12,22,.35)}
.pot .lbl{font-size:.8rem;color:#B9C8DB}
.pot .amt{font-family:var(--display);font-weight:800;font-size:1.85rem;line-height:1.05;color:var(--gold)}
.pot .sub{font-size:.78rem;color:#9FB2C8}
.pot-chips{display:flex;gap:2px;margin-bottom:4px}
.pot-chips i{width:16px;height:16px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 30deg,#B07A17 30deg 60deg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}

.seat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px;padding:8px 12px 10px;border-radius:var(--r-md);transition:background .25s}
.seat.turn{background:rgba(242,181,68,.10)}
.seat.won{background:rgba(61,214,140,.12)}
.seat.open{opacity:.6}
.seat .head{display:flex;align-items:center;gap:8px;max-width:180px}
.seat .name{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .bot{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.ring{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring .avatar{width:32px;height:32px}
.ring.timing{background:conic-gradient(var(--gold) calc(var(--p,1)*360deg),rgba(255,255,255,.12) 0)}
.pill{font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;background:rgba(5,12,22,.4);color:#C9D5E4;min-height:22px}
.pill.win{background:var(--win);color:#052414}
.pill.bust{background:rgba(255,107,94,.18);color:var(--loss)}
.pill.bj{background:var(--gold);color:var(--gold-ink)}
.pill.turn{background:var(--gold);color:var(--gold-ink)}
.seat.off .name::after{content:" (away)";color:var(--muted);font-weight:400}

.hand{display:flex;justify-content:center;min-height:84px;position:relative}
.you .hand{min-height:106px}
.hand:empty{min-height:0}
.total{position:absolute;right:-14px;top:-10px;min-width:30px;height:30px;border-radius:999px;background:var(--text);color:var(--bg);font-family:var(--display);font-weight:800;display:grid;place-items:center;padding:0 8px;font-size:.95rem;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.total.bust{background:var(--loss);color:#2B0703}
.total.bj{background:var(--gold);color:var(--gold-ink)}

.card{width:58px;height:84px;border-radius:7px;background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.35);margin-left:-20px;user-select:none}
.card:first-child{margin-left:0}
.card.red{color:var(--card-red)}
.card .c-mid{align-self:center;font-size:1.65em;line-height:1}
.card .c-bot{align-self:flex-end;transform:rotate(180deg)}
.card.back{background:var(--card);padding:4px}
.card.back::after{content:"";flex:1;border-radius:4px;background:repeating-linear-gradient(45deg,#1F4C74 0 5px,#163A5A 5px 10px);box-shadow:inset 0 0 0 2px var(--gold)}
.you .card{width:74px;height:106px;font-size:1.25rem;margin-left:-24px}
.you .card:first-child{margin-left:0}
.card.deal{animation:deal .32s cubic-bezier(.2,.8,.3,1)}
@keyframes deal{from{transform:translate(0,-40px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width:640px){
  .seat{min-width:0;padding:6px}
  .card{width:42px;height:61px;font-size:.85rem;margin-left:-16px}
  .you .card{width:62px;height:89px;font-size:1.05rem}
  .you .hand{min-height:89px}
  .hand{min-height:62px}
  .pot .amt{font-size:1.6rem}
}

/* action dock */
.dock{scroll-margin-bottom:12px;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -10px 40px rgba(5,10,20,.55);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.dock .say{font-size:1.15rem;font-weight:600;margin:0}
.dock .help{color:var(--muted);margin:4px 0 0;font-size:.95rem;max-width:60ch}
.dock .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.dock .acts .btn{min-width:130px}
.dock .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.dock .bar i{display:block;height:100%;background:var(--gold);width:100%}
.dock.result{border-color:transparent}
.dock.result.win{background:linear-gradient(0deg,rgba(61,214,140,.10),rgba(61,214,140,.10)),var(--surface);border-color:rgba(61,214,140,.4)}
.dock.result .big{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:0}
.dock.result.win .big{color:var(--win)}
@media (max-width:640px){
  .dock{grid-template-columns:minmax(0,1fr);padding:16px}
  .dock .acts{justify-content:stretch}
  .dock .acts .btn{flex:1;min-width:0}
}
.kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:4px}
@media (hover:none){.kbd{display:none}}

/* ---------- sheet (wallet, rules, fairness) ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,16,.6);z-index:40;animation:fade .2s}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;animation:slide .25s cubic-bezier(.2,.8,.3,1);padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet-body{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;font-size:1.1rem}
@keyframes slide{from{transform:translateX(40px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wallet-hero{background:var(--raised);border-radius:var(--r-md);padding:18px}
.wallet-hero .lbl{color:var(--muted);font-size:.88rem}
.wallet-hero .amt{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1.1}
.wallet-hero .amt small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:6px}
.wallet-hero .addr-row{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted)}
.linked-row{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.92rem;padding:12px 2px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--raised);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--text);color:var(--bg)}
.move{display:flex;flex-direction:column;gap:12px}
.amount-row{display:flex;gap:8px}
.amount-row .input{font-family:var(--display);font-size:1.3rem;font-weight:700}
.breakdown{background:var(--raised);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.breakdown div{display:flex;justify-content:space-between;gap:10px}
.breakdown .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.breakdown .warn{color:var(--loss)}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.history li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.history .t{color:var(--muted);font-size:.8rem}
.history .a{text-align:right;font-weight:600}
.history .a.in{color:var(--win)}
.history .a.fee{color:var(--muted);font-weight:500}
.rules{display:flex;flex-direction:column;gap:22px}
.rules h3{margin-bottom:2px}
.rules p,.rules li{color:#C3CEDD;font-size:.95rem;margin:0}
.rules ul{padding-left:18px;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.rules section{display:flex;flex-direction:column;gap:6px}
.hash{font-family:var(--mono);font-size:.75rem;color:var(--muted);word-break:break-all;background:var(--raised);border-radius:var(--r-sm);padding:10px}
.ok{color:var(--win)} .bad{color:var(--loss)}
.backup summary{cursor:pointer;color:var(--muted)}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{background:var(--text);color:var(--bg);border-radius:12px;padding:12px 18px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:fade .2s;pointer-events:auto}
.toast.error{background:var(--loss);color:#2B0703}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sign in with X */
.xbtn{background:#F4F6FA;border-color:#F4F6FA;color:#0B1322}
.xbtn:hover:not(:disabled){background:#fff!important;border-color:#fff!important}
.xbox{width:100%}
.demo-x{display:flex;flex-direction:column;gap:6px}
.other{font-size:.9rem;color:var(--muted)}
.other summary{cursor:pointer}
.other .btn{margin-top:10px}
.connect{display:flex;flex-direction:column;gap:10px;background:var(--raised);border-radius:var(--r-md);padding:18px}
.connect p{margin:0;font-size:.92rem}
.small{font-size:.85rem}
</style>
